name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck app
        run: npm run typecheck

      # The Edge Functions are Deno TypeScript and are invisible to eslint/tsc,
      # which target the browser app. Without these steps a type error, a bad
      # import, or a wrong table/column name in supabase/functions/ only ever
      # surfaces in production.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Lint Edge Functions
        run: npm run lint:functions

      - name: Typecheck Edge Functions
        run: npm run typecheck:functions
      - name: Test Edge Functions
        run: npm run test:functions

      - name: Unit tests
        run: npm test -- --reporter=default --reporter=json --outputFile=test-results.json
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Test coverage
        run: npm run test:coverage
      - name: Build webpage
        env:
          GHPAGES_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
