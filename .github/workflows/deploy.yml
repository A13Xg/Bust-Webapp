name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    name: Build, test, and deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bust
          POSTGRES_PASSWORD: bust
          POSTGRES_DB: bust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bust -d bust_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bust:bust@127.0.0.1:5432/bust_test
      PGSSLMODE: disable
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare database schema
        run: npm run db:migrate
      - name: Unit tests
        run: npm test
      - name: Database connection check
        run: npm run db:check
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: yuorggekucycvxrtqvvp
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          for function_dir in supabase/functions/*; do
            test -f "$function_dir/index.ts" || continue
            supabase functions deploy "$(basename "$function_dir")" --project-ref "$SUPABASE_PROJECT_REF"
          done
      - name: Verify Supabase Pages secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is not set"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::VITE_SUPABASE_ANON_KEY is not set"; exit 1; }
          # Without the VAPID public key the app builds fine and then silently
          # refuses to create push subscriptions. Fail here instead.
          test -n "$VITE_WEB_PUSH_PUBLIC_KEY" || { echo "::error::VITE_WEB_PUSH_PUBLIC_KEY is not set — push notifications would ship disabled"; exit 1; }
      - name: Build webpage for GitHub Pages
        env:
          GHPAGES_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ secrets.VITE_WEB_PUSH_PUBLIC_KEY }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
